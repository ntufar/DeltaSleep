[package]
name = "deltasleep-dsp"
version = "0.1.0"
edition = "2021"

[lib]
name = "deltasleep_dsp"
# rlib in addition to cdylib so host-side integration tests (dsp/tests/) can
# link against the crate; the Android build still only packages the cdylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
strip = true
