# Tell the NDK linker to align ELF load segments to 16 KB.
# Required for Android 15+ (API 35) 16 KB page-size devices.
# x86_64 emulator does not enforce 16 KB pages but the flag is harmless there.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
