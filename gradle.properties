android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# AGP 9 built-in Kotlin only accepts Kotlin sources registered through
# android.sourceSets, but KSP (Room codegen) still registers its
# build/generated/ksp output via kotlin.sourceSets. This flag keeps that
# working until KSP migrates to the new DSL (prescribed by the AGP error).
android.disallowKotlinSourceSets=false
kotlin.code.style=official
