<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#06101f"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8deff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8deff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="crescent"><rect x="0" y="0" width="512" height="512" fill="#fff"/><circle cx="290" cy="130" r="62" fill="#000"/></mask>
    <clipPath id="circle">
      <rect x="0" y="0" width="512" height="512"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <g transform="translate(25.6 38) scale(0.9)">
  <!-- Subtle star field -->
  <g clip-path="url(#circle)" opacity="0.7">
    <circle cx="80"  cy="90"  r="1.5" fill="#a8c4e8"/>
    <circle cx="140" cy="55"  r="1"   fill="#a8c4e8"/>
    <circle cx="200" cy="80"  r="1.5" fill="#c8deff"/>
    <circle cx="310" cy="60"  r="1"   fill="#a8c4e8"/>
    <circle cx="370" cy="100" r="1.5" fill="#a8c4e8"/>
    <circle cx="430" cy="75"  r="1"   fill="#c8deff"/>
    <circle cx="60"  cy="160" r="1"   fill="#a8c4e8"/>
    <circle cx="450" cy="150" r="1.5" fill="#a8c4e8"/>
    <circle cx="110" cy="200" r="1"   fill="#c8deff"/>
    <circle cx="420" cy="200" r="1"   fill="#a8c4e8"/>
    <circle cx="90"  cy="310" r="1"   fill="#a8c4e8"/>
    <circle cx="460" cy="290" r="1.5" fill="#c8deff"/>
  </g>

  <!-- Moon glow halo -->
  <circle cx="256" cy="148" r="110" fill="url(#moonGlow)"/>

  <!-- Crescent moon -->
  <g filter="url(#glow)">
    <circle cx="256" cy="148" r="72" fill="#ddeeff" mask="url(#crescent)"/>
  </g>

  <!-- Delta (Δ) wave / sleep-phase line -->
  <!-- This traces a hypnogram-style step wave: Awake → Light → Deep → Light → Awake -->
  <g filter="url(#softGlow)">
    <polyline
      points="
        70,360
        70,360
        120,360
        120,320
        170,320
        170,290
        220,290
        220,390
        270,390
        270,310
        310,310
        310,360
        355,360
        355,320
        400,320
        400,360
        445,360
      "
      fill="none"
      stroke="#5ba3f5"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    />
  </g>

  <!-- Axis line under the wave -->
  <line x1="60" y1="395" x2="452" y2="395" stroke="#2a4a7a" stroke-width="2" opacity="0.6"/>

  <!-- Delta symbol subtly behind moon as a watermark -->
  <text
    x="256" y="175"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="54"
    font-weight="bold"
    fill="#06101f"
    opacity="0.22"
    clip-path="url(#circle)"
  >Δ</text>

  
</g>
</svg>
